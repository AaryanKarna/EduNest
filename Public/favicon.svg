<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#1e3a8a"/>
  <g transform="translate(50, 48)">
    <!-- Cap top flat part -->
    <polygon points="-24,-8 0,-20 24,-8 0,4" fill="white"/>
    <!-- Cap board hanging down left -->
    <polygon points="0,4 -24,-8 -24,2 0,14" fill="#bfdbfe"/>
    <!-- Cap board hanging down right -->
    <polygon points="0,4 24,-8 24,2 0,14" fill="white"/>
    <!-- Tassel string -->
    <line x1="24" y1="-8" x2="24" y2="10" stroke="white" stroke-width="2.5"/>
    <!-- Tassel end -->
    <circle cx="24" cy="13" r="3" fill="#93c5fd"/>
  </g>
</svg>
